<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AIRadio 对讲控制台</title>
<style>body{font:15px system-ui;margin:0;background:#f1f5f3;color:#17332d}header{padding:22px 28px;background:#176b5e;color:white}main{max-width:1100px;margin:auto;padding:18px}section{background:white;padding:18px;margin:14px 0;border-radius:14px;box-shadow:0 2px 8px #17332d18}input,button{padding:9px;margin:4px;border:1px solid #c7d8d2;border-radius:7px}button{background:#176b5e;color:white;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{border:1px solid #cbdad5;border-radius:12px;padding:14px;background:#fbfdfc}.muted{color:#60746e;font-size:13px}.log{height:180px;min-height:180px;overflow:auto;background:#14201e;color:#d9f2e8;font:12px monospace;padding:7px;border-radius:6px}.talking{background:#fff3d6}</style>
<header><h1>AIRadio 对讲控制台</h1><div>创建房间、管理设备并测试实时语音</div></header><main><section id="login"><input id="u" value="admin"><input id="p" type="password" value="admin"><button onclick="login()">登录</button></section><div id="app" hidden><section><h2>房间</h2><div><input id="rn" placeholder="房间名称"><input id="rc" placeholder="创建设备 ID（可选）"><input id="ri" placeholder="邀请设备 ID，逗号分隔（可选）"><button onclick="createRoom()">创建房间</button><button onclick="refresh()">刷新</button></div><div id="rooms" class="grid"></div></section><section><h2>设备模拟器</h2><p class="muted">每张卡片是一台独立设备。在同一房间点击“开始麦克风对讲”，其它设备会显示说话状态并播放声音。</p><div><input id="did" placeholder="设备 ID，例如 truck-01"><button onclick="addSim()">添加设备</button></div><div id="sims" class="grid"></div></section></div></main>
<script>
const $=id=>document.getElementById(id),api=async(u,o={})=>{let r=await fetch(u,{...o,headers:{'Content-Type':'application/json'}});if(!r.ok)throw Error(await r.text());return r.json()};async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});$('login').hidden=true;$('app').hidden=false;refresh()}catch(e){alert(e.message)}}async function refresh(){let [rs,ds]=await Promise.all([api('/api/rooms'),api('/api/devices')]);$('rooms').innerHTML=rs.map(r=>`<div class=card><b>${r.name}</b><div class=muted>${r.is_default?'默认房间':'加入码：'+r.join_code}</div><div>设备：${(r.device_ids||[]).join(', ')||'暂无'}</div></div>`).join('');for(let x of ds){if(!document.querySelector(`[data-device-id=\"${x.device_id}\"]`))addSim(x.device_id)}}async function createRoom(){try{let ids=$('ri').value.split(',').map(x=>x.trim()).filter(Boolean),r=await api('/api/rooms',{method:'POST',body:JSON.stringify({name:$('rn').value,created_by_device_id:$('rc').value,device_ids:ids})});alert('房间已创建，加入码：'+r.join_code);$('rn').value='';refresh()}catch(e){alert(e.message)}}function wav(a){let b=new ArrayBuffer(44+a.length),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+a.length,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,a.length,true);new Uint8Array(b,44).set(a);return b}
function addSim(savedId){let id=(savedId||$('did').value).trim();if(!id)return;let d=document.createElement('div');d.dataset.deviceId=id;d.setAttribute('data-device-id',id);d.className='card';d.innerHTML=`<h3>设备 ${id}</h3><div data-state>未连接</div><button data-connect>连接</button><input data-name placeholder=新房间名><input data-invites placeholder="邀请设备 ID，逗号分隔（可选）"><button data-create disabled>创建房间</button><br><input data-code placeholder=六位加入码><button data-join disabled>加入房间</button><button data-leave disabled>回默认</button><br><button data-tone disabled>测试音</button><button data-mic disabled>🎙 开始麦克风对讲</button><pre class=log></pre>`;$('sims').append(d);$('did').value='';let ws=null,st=d.querySelector('[data-state]'),log=d.querySelector('.log'),room='未知',mid='',frames=0,mic=null,ctx=null,say=x=>{log.textContent+=new Date().toLocaleTimeString()+' '+x+'\n';log.scrollTop=log.scrollHeight},buttons=[...d.querySelectorAll('button:not([data-connect])')],setEnabled=v=>buttons.forEach(x=>x.disabled=!v),send=m=>{if(!ws||ws.readyState!==WebSocket.OPEN){say('未连接，无法发送 '+JSON.stringify(m));return}say('发送 '+JSON.stringify(m));ws.send(JSON.stringify(m))},finish=()=>{if(mid){send({type:'end',message_id:mid,frame_count:frames});mid='';frames=0}};setEnabled(false);d.querySelector('[data-connect]').onclick=()=>{if(ws&&ws.readyState<=1){ws.close();return}let url=(location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws';say('连接 '+url);ws=new WebSocket(url);ws.onopen=()=>{say('WebSocket 已连接，发送 hello');send({type:'hello',version:1,device_id:id})};ws.onerror=()=>say('WebSocket 错误');ws.onclose=()=>{st.textContent='未连接';setEnabled(false);d.querySelector('[data-connect]').textContent='连接';say('连接已关闭')};ws.onmessage=e=>{if(typeof e.data==='string'){let m;try{m=JSON.parse(e.data)}catch(_){say('非法控制帧');return}say('收到 '+JSON.stringify(m));if(m.type==='hello_ack'){if(!m.ok){say('hello 被拒绝：'+m.error);ws.close();return}room=m.room_name||m.room_id||'未知';st.textContent='房间：'+room;setEnabled(true);d.querySelector('[data-connect]').textContent='断开'}if(m.room_name&&(m.type==='join_room_ack'||m.type==='create_room_ack'||m.type==='room_state')){room=m.room_name;st.textContent='房间：'+room;if(m.type==='create_room_ack')refresh()}if(m.type==='start'){st.textContent='房间：'+room+' · '+m.source_id+' 正在说话';d.classList.add('talking');send({type:'receive_ready',message_id:m.message_id})}if(m.type==='end'||m.type==='end_ack'||m.type==='abort'){st.textContent='房间：'+room;d.classList.remove('talking')}}else{say('收到音频帧 bytes='+e.data.size);e.data.arrayBuffer().then(x=>new Audio(URL.createObjectURL(new Blob([wav(new Uint8Array(x))],{type:'audio/wav'}))).play().catch(err=>say('播放失败 '+err)))}}};d.querySelector('[data-create]').onclick=()=>send({type:'create_room',name:d.querySelector('[data-name]').value,creator_device_id:id,invite_device_ids:d.querySelector('[data-invites]').value.split(',').map(x=>x.trim()).filter(Boolean)});d.querySelector('[data-join]').onclick=()=>send({type:'join_room',code:d.querySelector('[data-code]').value});d.querySelector('[data-leave]').onclick=()=>send({type:'leave_room'});d.querySelector('[data-tone]').onclick=()=>{mid=id+'-'+Date.now();frames=0;send({type:'start',message_id:mid,frame_ms:60,sample_rate:16000});st.textContent='房间：'+room+' · 正在说话';let a=new Uint8Array(800);for(let i=0;i<a.length;i++)a[i]=128+60*Math.sin(i/5);setTimeout(()=>{if(mid){ws.send(a);frames=1;finish()}},100)};d.querySelector('[data-mic]').onclick=async()=>{let bt=d.querySelector('[data-mic]');if(mic){mic.getTracks().forEach(t=>t.stop());ctx.close();mic=null;finish();bt.textContent='🎙 开始麦克风对讲';return}try{mic=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new AudioContext();let src=ctx.createMediaStreamSource(mic),pr=ctx.createScriptProcessor(4096,1,1);mid=id+'-'+Date.now();frames=0;send({type:'start',message_id:mid,frame_ms:60,sample_rate:16000});st.textContent='房间：'+room+' · 正在说话';bt.textContent='⏹ 停止麦克风';pr.onaudioprocess=e=>{if(!mid)return;let q=e.inputBuffer.getChannelData(0),a=new Uint8Array(q.length);for(let i=0;i<a.length;i++)a[i]=Math.max(0,Math.min(255,128+q[i]*100));ws.send(a);frames++};src.connect(pr);pr.connect(ctx.destination)}catch(e){say('麦克风失败 '+e.message)}}}

</script>
